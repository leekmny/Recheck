[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recheck"
version = "0.1.7"
description = "Local binary reconstruction fidelity analyzer"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials==6.12.0", "PySide6-Addons==6.12.0", "PySide6-WebEngine==6.12.0.140", "pydantic>=2.10", "httpx>=0.28", "psutil>=6", "PyJWT[crypto]>=2.15.1", "jsonschema>=4.26"]

[project.scripts]
recheck = "recheck.cli:main"

[project.gui-scripts]
recheck-gui = "recheck.gui:main"

[tool.setuptools.packages.find]
include = ["recheck*", "ai_providers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = true

[tool.ruff]
target-version = 'py311'
line-length = 100
extend-exclude = ['verification', 'build', 'dist', '.venv-build']

[tool.ruff.lint]
# Start with correctness checks; the audit records the wider style backlog.
select = ['E9', 'F63', 'F7', 'F82', 'B006', 'B008']
