[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recheck"
version = "0.1.2"
description = "Local binary reconstruction fidelity analyzer"
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8", "pydantic>=2.10", "httpx>=0.28", "psutil>=6", "PyJWT[crypto]>=2.15.1", "jsonschema>=4.26"]

[project.scripts]
recheck = "recheck.cli:main"

[project.gui-scripts]
recheck-gui = "recheck.gui:main"

[tool.setuptools.packages.find]
include = ["recheck*", "ai_providers*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ['py311']
skip-string-normalization = true
